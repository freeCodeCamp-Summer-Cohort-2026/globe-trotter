name: CI

on: 
  pull_request:
    branches:
        - main
  push:
    branches:
        - main 
        
        
jobs:
    ci:
        runs-on: ubuntu-latest
        services:
          postgres:
            image: postgres:15
            env:
              POSTGRES_USER: globe-trotter
              POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
              POSTGRES_DB: globe_trotter_test
            ports:
              - 5432:5432
            options: >-
              --health-cmd pg_isready
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup pnpm
          uses: pnpm/action-setup@v6
          with: 
            version: 11.22.0
          
        - name: Setup Node.js
          uses: actions/setup-node@v7
          with: 
            node-version: 24
            cache: pnpm 

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Create migration test database
          run: |
            PGPASSWORD=${{ secrets.TEST_DB_PASSWORD }} psql \
              -h localhost \
              -U globe-trotter \
              -d postgres \
              -c "CREATE DATABASE globe_trotter_migration_test;"

        - name: Build
          run: pnpm build  

        - name: Lint
          run: pnpm lint  

        - name: Test
          run: pnpm test
          env:
            NODE_ENV: test
            TEST_DATABASE_URL: postgres://globe-trotter:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/globe_trotter_test
            MIGRATION_TEST_DATABASE_URL: postgres://globe-trotter:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/globe_trotter_migration_test